name: "Helm Push"
description: "Perform Helm Push"
inputs:
  appid:
    description: "Application ID"
    required: true
  orgid:
    description: "Organization ID"
    required: true
  buid:
    description: "Build ID"
    required: true
  role-to-assume:
    description: "Role to assume"
    required: true
  region:
    description: "Region"
    required: false
    default: "us-east-1"
  chart-archive:
    description: "The .tgz file name"
    value: ${{ steps.package.outputs.chart-archive }}
  version:
    description: "The final version of the chart (calculated or override)"
    value: ${{ steps.package.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Configure AWS Credentials
      id: configure-aws
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.region }}
        role-session-name: githubactions-${{ github.run_id }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Push Helm Chart to AWS ECR
      id: push-to-ecr
      shell: bash
      env:
        ORGID: ${{ inputs.orgid }}
        BUID: ${{ inputs.buid }}
        APPID: ${{ inputs.appid }}
        REGION: ${{ inputs.region }}
        CHART_ARCHIVE: ${{ inputs.chart-archive }}
        IMAGE: ${{ inputs.image }}
        PACKAGE: ${{ inputs.package }}
        VERSION: ${{ inputs.version }}
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      run: |
        chmod +x ${{ github.action_path }}/scripts/push_helm_to_ecr.sh
        ${{ github.action_path }}/scripts/push_helm_to_ecr.sh
